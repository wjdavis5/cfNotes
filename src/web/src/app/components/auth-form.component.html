<div class="auth-form">
  <h2 class="form-title">Welcome</h2>
  <p class="form-subtitle">Enter your details to access your notes</p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="input-icon">
          <path d="M3 4a2 2 0 00-2 2v1.161l8.441 4.221a1.25 1.25 0 001.118 0L19 7.162V6a2 2 0 00-2-2H3z" />
          <path d="M19 8.839l-7.77 3.885a2.75 2.75 0 01-2.46 0L1 8.839V14a2 2 0 002 2h14a2 2 0 002-2V8.839z" />
        </svg>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="Enter your email"
          [disabled]="loading"
        >
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="input-icon">
          <path fillRule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clipRule="evenodd" />
        </svg>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
          [disabled]="loading"
        >
      </div>
      <p class="input-help">Your password is used to encrypt your notes and is never stored.</p>
    </div>

    <div *ngIf="error" class="error-message">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="error-icon">
        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clipRule="evenodd" />
      </svg>
      <span>{{ error }}</span>
    </div>

    <button
      type="submit"
      [disabled]="loading || !email || !password"
      class="submit-button"
    >
      <span *ngIf="loading" class="spinner"></span>
      <span *ngIf="!loading">Sign In</span>
      <span *ngIf="loading">Signing In...</span>
    </button>
  </form>

  <div class="form-footer">
    <p>No account needed! Just enter your email and password to begin.</p>
  </div>
</div>
